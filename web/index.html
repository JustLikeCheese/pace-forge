<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运动世界校园 · 记录看板</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
.msg.warn{color:#f5b942}
.ok{color:#22d3a6}
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1f232c;
    --line: #2a2f3a; --fg: #e6e8ec; --dim: #8b93a1;
    --ok: #3fb950; --bad: #f85149; --accent: #4493f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  a { color: var(--accent); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ---- 登录 ---- */
  #login {
    max-width: 380px; margin: 12vh auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 32px 28px;
  }
  #login h1 { font-size: 19px; margin: 0 0 6px; font-weight: 600; }
  #login p.sub { color: var(--dim); font-size: 13px; margin: 0 0 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; background: var(--panel2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; padding: 11px; background: var(--accent); color: #fff; border: 0;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .msg { font-size: 13px; margin-top: 14px; min-height: 20px; }
  .msg.warn { color:#f5b942; border-color:#5a4a1e; background:#2a2416; }
.msg.err { color: var(--bad); }
  .msg.ok { color: var(--ok); }

  /* ---- 主界面 ---- */
  #app { display: none; }
  .topbar {
    display: flex; align-items: center; gap: 14px; padding-bottom: 18px;
    border-bottom: 1px solid var(--line); margin-bottom: 20px; flex-wrap: wrap;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; background: var(--accent);
    display: grid; place-items: center; font-weight: 700; color: #fff;
  }
  .who { flex: 1; min-width: 180px; }
  .who b { font-size: 15px; }
  .who div { color: var(--dim); font-size: 12px; }
  .ghost {
    width: auto; padding: 7px 14px; background: transparent; color: var(--dim);
    border: 1px solid var(--line); font-weight: 400; font-size: 13px;
  }
  .ghost:hover { color: var(--fg); border-color: var(--dim); }

  .grid { display: grid; grid-template-columns: 400px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .panel h2 {
    font-size: 13px; font-weight: 600; color: var(--dim); margin: 0;
    padding: 14px 16px; border-bottom: 1px solid var(--line); letter-spacing: .3px;
  }
  #list { max-height: 62vh; overflow-y: auto; }
  .rec {
    padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .rec:hover { background: var(--panel2); }
  .rec.sel { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
  .rec .r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rec .dist { font-size: 16px; font-weight: 600; }
  .rec .tag { font-size: 11px; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
  .tag.ok { background: rgba(63,185,80,.15); color: var(--ok); }
  .tag.bad { background: rgba(248,81,73,.15); color: var(--bad); }
  .rec .r2 { color: var(--dim); font-size: 12px; margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
  .empty { padding: 30px 16px; text-align: center; color: var(--dim); font-size: 13px; }

  #map { height: 42vh; min-height: 300px; background: #0b0d11; }
  #detail { padding: 14px 16px; font-size: 13px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
  .kv span:nth-child(odd) { color: var(--dim); }
  .hint { color: var(--dim); font-size: 12px; padding: 0 16px 14px; }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .spin {
    width: 15px; height: 15px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: sp .7s linear infinite; display: inline-block; vertical-align: -2px;
  }
  @keyframes sp { to { transform: rotate(360deg); } }

.runform { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
.runform label { display: flex; flex-direction: column; font-size: 12px; color: #93a4b8; gap: 4px; }
.runform input { width: 84px; padding: 7px 9px; background: #0e141c; border: 1px solid #223041;
  border-radius: 7px; color: #e6edf3; font-size: 14px; }
.runform button { padding: 8px 16px; background: #22d3a6; color: #06121a; border: 0;
  border-radius: 7px; font-weight: 600; cursor: pointer; height: 36px; }
.runform button:disabled { opacity: .5; cursor: default; }
.planout { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; }
.planout:empty { display: none; }
.kv { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0;
  border-bottom: 1px solid #161f2b; }
.kv span { color: #7d8ea3; }
.kv b { color: #e6edf3; font-weight: 600; }
.kv b.mono { font-family: ui-monospace, monospace; font-size: 11px; }
.planout .note { grid-column: 1/-1; margin-top: 8px; font-size: 12px; color: #6b7c91; }
button.mini{padding:3px 8px;font-size:11px;line-height:1.6}
button.mini:disabled{opacity:.35}
button.danger{background:#dc2626;border-color:#dc2626;color:#fff}
button.danger:hover{background:#b91c1c}
button.danger:disabled{opacity:.5}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <h1>运动世界校园</h1>
  <p style="font-size:10px;color:#30363d;font-family:monospace;margin:0">9077a37 · 11-06 09:34</p>
  <p class="sub">登录后查看跑步记录与轨迹</p>
  <div class="field">
    <label>手机号</label>
    <input id="u" type="tel" autocomplete="username" placeholder="请输入手机号">
  </div>
  <div class="field">
    <label>密码</label>
    <input id="p" type="password" autocomplete="current-password" placeholder="请输入密码">
  </div>
  <button id="btn">登录并保存</button>
  <div class="msg" id="msg"></div>
</div>

<div id="picker" style="display:none"></div>

<!-- 主界面 -->
<div id="app" class="wrap">
  <div class="topbar">
    <span id="buildTag" title="构建版本" style="position:fixed;right:6px;bottom:4px;font-size:10px;color:#30363d;font-family:monospace;z-index:999">9077a37 · 11-06 09:34</span>
    <div class="avatar" id="ava">·</div>
    <div class="who">
      <b id="uname">—</b>
      <div id="uinfo">—</div>
    </div>
    <button class="ghost" id="semBtn">查学期</button>
    <button class="ghost" id="reload">刷新记录</button>
    <button class="ghost" id="logout" title="让服务端 token 失效；账号和密码都保留，下次点「重登」即可">退出登录</button>
  </div>

  <div class="panel" id="accPanel">
    <h2>账号 <span id="accCount" class="hint" style="font-weight:400"></span></h2>
    <div id="accList"><div class="hint">加载中…</div></div>
    <div class="runform" style="margin-top:12px;padding-top:12px;border-top:1px solid #21262d">
      <input id="accUser" type="tel" placeholder="手机号" style="flex:1;min-width:120px">
      <input id="accPass" type="password" placeholder="密码" style="flex:1;min-width:120px">
      <button id="accAdd">添加</button>
      <button class="ghost" id="accLoginAll">全部登录</button>
      <button class="ghost" id="accBatch">批量刷</button>
    </div>
    <div id="accMsg" class="msg"></div>
  </div>

  <div class="panel" id="semPanel">
    <h2>记分跑 · 学期进度</h2>
    <div id="semOut" class="planout"><div class="hint">点右上「查学期」加载</div></div>
  </div>

  <div class="panel" id="runPanel">
    <h2>刷跑</h2>
    <div class="runform">
      <label>跑法<select id="rRunMode">
        <option value="1">记分跑（校园跑）</option>
        <option value="2">户外跑</option>
        <option value="3">室外锻炼</option>
      </select></label>
      <label>路线<select id="rMode">
        <option value="free">自动规划（算法生成）</option>
        <option value="draw">手绘轨迹（自己画）</option>
        <option value="stadium">操场绕圈（算法生成）</option>
      </select></label>
      <label id="laneWrap" style="display:none">道次<select id="rLane">
        <option>1</option><option>2</option><option>3</option><option>4</option>
        <option>5</option><option>6</option><option>7</option><option>8</option>
      </select></label>
      <label title="勾选后每次提交在下面区间里随机取距离；批量时每个账号各取一个，彼此不同">
        <input id="rAutoDist" type="checkbox" checked> 距离自动
        <span style="display:inline-flex;gap:4px;align-items:center;margin-left:4px">
          <input id="rDistMin" type="number" value="2.0" step="0.1" min="0.5" max="21" style="width:58px">
          ~
          <input id="rDistMax" type="number" value="2.4" step="0.1" min="0.5" max="21" style="width:58px">
        </span>
      </label>
      <label>距离 km<input id="rDist" type="number" value="2.0" step="0.1" min="0.5" max="21"></label>
      <label>配速 分/km
        <span style="display:inline-flex;gap:4px;align-items:center">
          <input id="rPaceMin" type="number" value="5.5" step="0.1" min="2" max="12" style="width:64px">
          ~
          <input id="rPaceMax" type="number" value="6.6" step="0.1" min="2" max="12" style="width:64px">
        </span>
      </label>
      <label title="按上面的配速区间随机取一个配速，乘距离得到时长；每次提交都重新随机">
        <input id="rAutoDur" type="checkbox" checked> 时长自动
        <span id="durHint" class="hint"></span>
      </label>
      <label>时长 分<input id="rDur" type="number" value="12" step="0.1" min="3" max="180" readonly></label>
      <label>步数<input id="rSteps" type="number" step="10" min="100" placeholder="留空按配速自动推算"></label>
      <label>何时跑<select id="rWhen">
        <option value="now">现在</option>
        <option value="at">指定时刻</option>
        <option value="ago">N 分钟前</option>
        <option value="rand">当天随机</option>
      </select></label>
      <label id="wrapAt" style="display:none">时刻<input id="rAt" type="time" value="07:30"></label>
      <label id="wrapDays" style="display:none">几天前<input id="rDays" type="number" min="0" max="3" value="0" style="width:70px"></label>
      <label id="wrapAgo" style="display:none">分钟前<input id="rAgo" type="number" min="1" max="5760" value="60" style="width:80px"></label>
      <div id="drawWrap" style="display:none;flex-basis:100%">
        <div class="hint" style="margin:6px 0">
          在地图上按住拖动画出路线，起点就是开跑位置。画完点“用这条轨迹”。
        </div>
        <button id="drawStart" class="ghost">开始绘制</button>
        <button id="drawUndo" class="ghost">撤销上一笔</button>
        <button id="drawClear" class="ghost">清空</button>
        <button id="drawUse">用这条轨迹</button>
        <span id="drawInfo" class="hint" style="margin-left:8px"></span>
      </div>
      <div id="blockWrap" style="flex-basis:100%;margin-top:6px">
        <button id="blockStart" class="ghost">标注禁区（画楼）</button>
        <button id="blockUndo" class="ghost">撤销上一块</button>
        <button id="blockSave" class="ghost">保存禁区</button>
        <span id="blockInfo" class="hint"></span>
      </div>
      <button id="planBtn">生成轨迹</button>
      <button id="runBtn" class="danger">真的跑（提交）</button>
    </div>
    <div id="planOut" class="planout"></div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>跑步记录</h2>
      <div id="list"><div class="empty">加载中…</div></div>
    </div>
    <div>
      <div class="panel">
        <h2>轨迹地图</h2>
        <div id="map"></div>
        <div id="detail" class="hint">选择左侧一条记录查看轨迹</div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const $ = id => document.getElementById(id);
const api = async (url, opt) => {
  const r = await fetch(url, opt);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '请求失败');
  return j.data;
};

/* ---------- 登录 ---------- */
$('btn').onclick = async () => {
  const u = $('u').value.trim(), p = $('p').value;
  if (!u || !p) return setMsg('手机号和密码都要填', 'err');
  $('btn').disabled = true;
  setMsg('登录中…');
  try {
    const me = await api('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    $('p').value = '';
    enter(me);
  } catch (e) {
    setMsg(e.message, 'err');
  } finally {
    $('btn').disabled = false;
  }
};
$('p').onkeydown = e => { if (e.key === 'Enter') $('btn').click(); };
function setMsg(t, cls) { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (cls || ''); }

/* ---------- 进入主界面 ---------- */
function enter(me) {
  $('login').style.display = 'none';
  $('app').style.display = 'block';
  $('ava').textContent = (me.name || me.username || '?').slice(0, 1);
  $('uname').textContent = me.name || me.username;
  $('uinfo').textContent = [me.campus_name, me.depart, me.grade_class].filter(Boolean).join(' · ') || '—';
  initMap();
  loadRecords();
}
$('logout').onclick = async () => {
  // 退出登录 = 让服务端 token 失效 + 清本地登录态。
  // 账号和存盘密码都留着，下次打开页面点「重登」即可，不用重新输密码。
  const btn = $('logout');
  btn.disabled = true;
  btn.textContent = '退出中…';
  try {
    await fetch('/api/logout', { method: 'POST', cache: 'no-store' });
  } catch (_) {}
  // 清掉本地残留，避免任何 form/地图状态带回来
  try { localStorage.clear(); sessionStorage.clear(); } catch (_) {}
  // reload 可能命中缓存，用 replace 强制重新拉
  location.replace(location.pathname + '?t=' + Date.now());
};
$('reload').onclick = loadRecords;

$('rMode').onchange = () => {
  const v = $('rMode').value;
  $('laneWrap').style.display = v === 'stadium' ? '' : 'none';
  $('drawWrap').style.display = v === 'draw' ? '' : 'none';
  if (v === 'draw') {
    // 手绘必须看得见地图，滚过去并确保地图已初始化
    initMap();
    setTimeout(() => {
      initDrawing();
      $('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (map) map.invalidateSize();
    }, 60);
    setOut('已切到手绘：在地图上按住拖动画出路线，画完点「用这条轨迹」');
  } else {
    setDrawMode(false);
    if (v === 'stadium') {
      setOut('已切到操场绕圈：算法按道次生成标准跑道');
    } else {
      setOut('已切到自动规划：算法按围栏和点位算路线');
    }
  }
};

/* ---------- 时长自动生成 ----------
 * 每次都 12:00 整，时长一模一样，一眼就是脚本。改成按配速区间随机：
 *   duration(分) = 距离(km) × 配速(分/km)，配速在 [min, max] 里均匀取
 * 5.5~6.6 分/km 跑 2 km 就是 11:00~13:12，天然浮动。
 */
function paceRange() {
  const a = parseFloat($('rPaceMin').value);
  const b = parseFloat($('rPaceMax').value);
  const lo = Number.isFinite(a) && a >= 2 && a <= 12 ? a : 5.5;
  const hi = Number.isFinite(b) && b >= 2 && b <= 12 ? b : 6.6;
  return [Math.min(lo, hi), Math.max(lo, hi)];
}

function autoDur(dist) {
  const [lo, hi] = paceRange();
  const pace = lo + Math.random() * (hi - lo);
  // 落到 1 秒粒度，看起来就是真跑出来的
  return Math.max(3, Math.round(dist * pace * 60) / 60);
}

function fmtPaceMin(v) {
  if (!(v > 0)) return '—';
  const m = Math.floor(v), sec = Math.round((v - m) * 60);
  return m + "'" + String(sec).padStart(2, '0') + '"';
}

function distRange() {
  const a = parseFloat($('rDistMin').value);
  const b = parseFloat($('rDistMax').value);
  const lo = Number.isFinite(a) && a >= 0.5 ? a : 2.0;
  const hi = Number.isFinite(b) && b >= 0.5 ? b : 2.4;
  return [Math.min(lo, hi), Math.max(lo, hi)];
}

/// 取本次要用的距离（km）。勾了自动就现随机一个并回填输入框（10m 粒度）。
function readDist() {
  if (!$('rAutoDist').checked) return parseFloat($('rDist').value) || 0;
  const [lo, hi] = distRange();
  const d = Math.round((lo + Math.random() * (hi - lo)) * 100) / 100;
  $('rDist').value = d.toFixed(2);
  return d;
}

/// 取本次要用的时长（分钟）。勾了自动就现随机一个并回填输入框。
function readDur(dist) {
  if (!$('rAutoDur').checked) return parseFloat($('rDur').value) || 0;
  const d = autoDur(dist);
  $('rDur').value = d.toFixed(2);
  return d;
}

function syncDurHint() {
  const auto = $('rAutoDur').checked;
  $('rDur').readOnly = auto;
  if (auto) {
    const dist = parseFloat($('rDist').value) || 2;
    const [lo, hi] = paceRange();
    $('durHint').textContent = `（${fmtPaceMin(lo)}~${fmtPaceMin(hi)}/km → ${(dist * lo).toFixed(1)}~${(dist * hi).toFixed(1)} 分）`;
  } else {
    $('durHint').textContent = '';
  }
}

function syncDist() {
  $('rDist').readOnly = $('rAutoDist').checked;
  syncDurHint();
}

['rAutoDur', 'rPaceMin', 'rPaceMax', 'rDist'].forEach(id => {
  const el = $(id);
  if (el) { el.oninput = syncDurHint; el.onchange = syncDurHint; }
});
['rAutoDist', 'rDistMin', 'rDistMax'].forEach(id => {
  const el = $(id);
  if (el) { el.oninput = syncDist; el.onchange = syncDist; }
});
syncDist();

$('planBtn').onclick = async () => {
  let st = null;
  try { st = await resolveStartAt(); } catch (e) { if (e.message !== '已取消') setOut(e.message, true); return; }
  const dist = readDist();
  const dur = readDur(dist);
  const stepsRaw = $('rSteps').value.trim();
  const steps = stepsRaw === '' ? null : parseInt(stepsRaw, 10);
  if (!(dist > 0) || !(dur > 0)) return setOut('距离和时长要填正数', true);

  const btn = $('planBtn');
  btn.disabled = true;
  setOut('生成中…');
  try {
    const r = await api('/api/plan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        distance: dist, duration: dur,
        steps: (Number.isFinite(steps) && steps > 0) ? steps : 0,
        mode: $('rMode').value, lane: parseInt($('rLane').value, 10) || 1,
        runMode: parseInt($('rRunMode').value, 10) || 1,
        startAtMs: (st ? st.startMs : undefined),
        customPath: $('rMode').value === 'draw'
          ? (() => { const m = useDrawing(); return m && m.length >= 2 ? m : undefined; })()
          : undefined
      })
    });
    // 真实流程失败时后端回的是 {ok:false,error,logs}，没有轨迹字段，别按成功渲染
    if (r.ok === false) {
      setOut(r.error || '生成失败', true);
      $('planOut').innerHTML = `<div class="msg err">生成失败</div>
        <pre class="mono" style="font-size:11px;white-space:pre-wrap;max-height:300px;overflow:auto">${[r.error, '---', ...(r.logs || [])].join('\n')}</pre>`;
      return;
    }
    setOut('');
    const modeTxt = r.mode === 'stadium' ? `操场第 ${r.lane} 道`
      : (r.mode === 'draw' ? '手绘轨迹' : '自由路线');
    const acTxt = r.stepAutocorr != null
      ? `${r.stepAutocorr.toFixed(3)} ${r.stepAutocorr < 0.1 ? '(偏低)' : '(正常)'}`
      : '-';
    const issueHtml = (r.issues && r.issues.length)

    const policyHtml = r.policy
      ? `<div class="kv"><span>规则最小里程</span><b>${r.policy.minDistance} m</b></div>
         <div class="kv"><span>规则有效时长</span><b>${r.policy.validTime} s</b></div>`
      : '';
    const fenceHtml = r.fence
      ? `<div class="kv"><span>围栏</span><b class="${r.fence.fallback ? 'warn' : 'ok'}">${r.fence.name}${r.fence.fallback ? `（兜底 ${Math.round(r.fence.distance)}m）` : ''}</b></div>`

      ? `<div class="kv"><span>打卡点</span><b class="${r.checkpointPassed === r.checkpointTotal ? 'ok' : 'err'}">${r.checkpointPassed || 0} / ${r.checkpointTotal} 经过</b></div>`
      : '';
    $('planOut').innerHTML = `
      <div class="kv"><span>模式</span><b>${r.online ? '已连服务端' : '本地合成'} · ${modeTxt}</b></div>
      ${fenceHtml}
      ${cpHtml}
      ${policyHtml}
      <div class="kv"><span>实际里程</span><b>${r.actualLength} m</b></div>
      <div class="kv"><span>轨迹点数</span><b>${r.pointCount}</b></div>
      <div class="kv"><span>时间桶</span><b>${r.bucketCount}</b></div>
      <div class="kv"><span>平均步频</span><b>${(r.avgCadence ?? 0).toFixed(1)} 步/分</b></div>
      <div class="kv"><span>步数自相关</span><b>${acTxt}</b></div>
      <div class="kv"><span>自检</span><b class="${r.blocked ? 'err' : 'ok'}">${r.issueSummary}</b></div>
      ${issueHtml}
      ${r.logs && r.logs.length ? `<details style="margin-top:8px"><summary style="cursor:pointer;color:#8b949e">流程日志（${r.logs.length} 条）</summary><pre class="mono" style="font-size:11px;max-height:200px;overflow:auto;white-space:pre-wrap">${r.logs.join('\n')}</pre></details>` : ''}
      <div class="note">${r.note}</div>`;
    drawPreview(r.coords, r.fence, r.checkpoints);
  } catch (e) {
    setOut(e.message, true);
  } finally {
    btn.disabled = false;
  }
};

function setOut(t, err) {
  const o = $('planOut');
  o.innerHTML = t ? `<div class="msg ${err ? 'err' : ''}">${t}</div>` : '';
}
let lastCheckpoints = [];
let lastFence = null;

function drawPreview(coords, fence, checkpoints) {
  if (!map) return;
  if (checkpoints) lastCheckpoints = checkpoints;
  if (fence) lastFence = fence;
  if (previewLayer) { map.removeLayer(previewLayer); previewLayer = null; }

  const group = L.featureGroup();

  // 围栏
  if (fence && fence.ring && fence.ring.length) {
    const poly = L.polygon(fence.ring, {
      color: '#f59e0b', weight: 2, fillOpacity: 0.05, dashArray: '6 4'
    }).bindPopup('围栏：' + fence.name);
    group.addLayer(poly);
  }

  // 轨迹
  if (coords && coords.length) {
    group.addLayer(L.polyline(coords, { color: '#22d3a6', weight: 4, opacity: 0.9 }));
  }

  // 打卡点
  if (checkpoints && checkpoints.length) {
    for (const c of checkpoints) {
      const color = c.passed ? '#22c55e' : '#ef4444';
      group.addLayer(L.circleMarker([c.gcjLat != null ? c.gcjLat : c.lat,
                                     c.gcjLng != null ? c.gcjLng : c.lng], {
        radius: 7, color: color, fillColor: color, fillOpacity: 0.85, weight: 2
      }).bindPopup(
        `打卡点 #${c.index}<br>${c.passed ? '✓ 轨迹经过' : '✗ 未经过'}（最近 ${c.nearest}m）`
      ));
    }
  }

  previewLayer = group.addTo(map);
  try {
    const b = group.getBounds();
    if (b.isValid()) map.fitBounds(b, { padding: [30, 30] });
  } catch (e) {}
}

async function accountAction(act, id) {
  const m = $('accMsg');
  try {
    if (act === 'del') {
      if (!confirm('删除这个账号？\n\n会先退出登录再删（不然服务端会话留活，下次登要锁一小时），存盘的密码也会一起删掉。\n\n只是想换账号的话，用旁边的「退出」——密码留着，随时重登。')) return;
      m.textContent = '退出登录中…';
      const url = '/api/accounts/' + encodeURIComponent(id);
      let r = await api(url, { method: 'DELETE' });
      // 服务端没确认退出时后端不会真删，先让用户知道后果再决定
      if (r.needConfirm) {
        if (!confirm((r.warning || '服务端未确认退出登录。') + '\n\n仍要删除这个账号？')) {
          m.textContent = '已取消删除，账号还在';
          m.className = 'msg';
          return;
        }
        r = await api(url + '?force=1', { method: 'DELETE' });
      }
      m.textContent = r.remoteLogout
        ? '已退出登录并删除'
        : (r.removed ? '已删除（服务端未确认退出，建议半小时内别重登）' : '已取消删除');
    } else if (act === 'switch') {
      await api('/api/accounts/' + encodeURIComponent(id) + '/switch', { method: 'POST' });
      m.textContent = '已切换';
      await boot();
    } else if (act === 'login') {
      m.textContent = '登录中…';
      const r = await api('/api/accounts/' + encodeURIComponent(id) + '/login', { method: 'POST' });
      m.textContent = '登录成功：' + (r.name || r.uid);
    } else if (act === 'logout') {
      // 退出登录：通知服务端让 token 失效，本地只清登录态，密码留着。
      // 不走这一步直接删账号的话，服务端会话还活着，账号仍被标记「已登录」，
      // 下次登录触发 10121 并锁一小时。
      await api('/api/accounts/' + encodeURIComponent(id) + '/logout', { method: 'POST' });
      m.textContent = '已退出登录，密码已保留，随时可以重登';
    } else if (act === 'toggle') {
      await api('/api/accounts/' + encodeURIComponent(id) + '/toggle', { method: 'POST' });
      m.textContent = '';
    }
    m.className = 'msg';
    await loadAccounts();
  } catch (e) {
    m.textContent = e.message;
    m.className = 'msg err';
  }
}

$('rWhen').onchange = () => {

/** 问后端要补跑时刻。返回 {startMs, startText, stopText, clamped} 或 null（现在跑）。 */
async function resolveStartAt() {
  const mode = $('rWhen').value;
  if (mode === 'now') return null;
  const dur = Math.round(parseFloat($('rDur').value) * 60) || 720;
  const qs = new URLSearchParams({ mode, dur: String(dur) });
  if (mode === 'at') {
    qs.set('hhmm', $('rAt').value || '07:30');
    qs.set('days', $('rDays').value || '0');
  } else if (mode === 'ago') {
    qs.set('minutes', $('rAgo').value || '60');
  } else if (mode === 'rand') {
    qs.set('days', $('rDays').value || '0');
  }
  const r = await api('/api/starttimes?' + qs.toString());
  if (r.clamped) {
    if (!confirm(`你选的时间会让结束时刻落在未来。\n\n已自动提前到：${r.startText}\n结束：${r.stopText}\n\n继续？`)) {
      throw new Error('已取消');
    }
  }
  return r;
}

/* ---------- 地图 ---------- */
let map, layer, marker, previewLayer;
function initMap() {
  if (map) return;
  // 和 App 用同一套底图：App 里就是高德（DEX 里 com/amap/api/ 2564 处、
  // autonavi 600 处，com/baidu/mapapi/ 是空的）。
  //
  // 关键：高德瓦片是按 GCJ-02 网格切的，Leaflet 会把传进去的经纬度直接
  // 当作瓦片坐标算 z/x/y。所以喂给 Leaflet 的必须是 GCJ-02——点位用
  // gcjLat/gcjLng，手绘出来的也是 GCJ-02，不能混用 BD-09。
  map = L.map('map', { zoomControl: true }).setView([47.3842, 123.9583], 16);
  goHome(); // 有学到的校区就居中过去，别停在默认坐标

  const roadMap = L.tileLayer(
    'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
    { subdomains: '1234', maxZoom: 18, attribution: '© 高德地图' }
  );
  const satellite = L.tileLayer(
    'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
    { subdomains: '1234', maxZoom: 18, attribution: '© 高德地图' }
  );
  // 卫星图叠加路网标注，看着更像 App
  const satelliteLabel = L.tileLayer(
    'https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}',
    { subdomains: '1234', maxZoom: 18 }
  );
  const satLayer = L.layerGroup([satellite, satelliteLabel]);

  roadMap.addTo(map);
  L.control.layers({ '高德路网': roadMap, '高德卫星': satLayer }, null,
    { position: 'topright' }).addTo(map);
  layer = L.layerGroup().addTo(map);
  initDrawing();
  initBlockers();
}


/* ---------- 手绘轨迹 ---------- */

// 手绘状态。strokes 是若干条独立笔画，用户可能分几次画完整个圈。
let drawMode = false;
let strokes = [];
let currentStroke = null;
let drawLayer = null;
let isPointerDown = false;

// 两点间距离（米），haversine。前端只用它显示里程，精度够。
function metersBetween(a, b) {
  const R = 6371000;
  const rad = d => d * Math.PI / 180;
  const dLat = rad(b[0] - a[0]);
  const dLng = rad(b[1] - a[1]);
  const x = dLng * Math.cos(rad((a[0] + b[0]) / 2));
  return R * Math.sqrt(x * x + dLat * dLat);
}
function strokesLength() {
  let m = 0;
  for (const st of strokes) {
    for (let i = 1; i < st.length; i++) m += metersBetween(st[i - 1], st[i]);
  }
  return m;
}
function redrawStrokes() {
  if (!map) return;
  if (drawLayer) map.removeLayer(drawLayer);
  drawLayer = L.featureGroup().addTo(map);
  for (const st of strokes) {
    L.polyline(st, { color: '#22d3a6', weight: 4, opacity: 0.95 }).addTo(drawLayer);
    // 起点单独标一下，用户要知道从哪开跑
    L.circleMarker(st[0], {
      radius: 5, color: '#0ea5e9', fillColor: '#0ea5e9', fillOpacity: 0.9, weight: 2
    }).addTo(drawLayer).bindTooltip('起点');
  }
  const m = strokesLength();
  let txt = strokes.length
    ? `${strokes.length} 笔 · ${(m / 1000).toFixed(2)} km`
    : '还没画';

  // 记分跑要求顺序经过全部打卡点，画的时候就告诉用户漏了哪个
  if (strokes.length && lastCheckpoints.length) {
    const flat = [];
    for (const st of strokes) flat.push(...st);
    let hit = 0;
    const missed = [];
    for (const c of lastCheckpoints) {
      let best = Infinity;
      // 点位到任一采样点的距离；采样点本身就够密（3 m 一个）
      for (const q of flat) {
        const d = metersBetween([c.lat, c.lng], q);
        if (d < best) best = d;
      }
      if (best < 25) hit++;
      else missed.push(`#${c.index}`);
    }
    txt += ` · 点位 ${hit}/${lastCheckpoints.length}`;
    if (missed.length) txt += `（漏 ${missed.join(',')}）`;
  }
  $('drawInfo').textContent = txt;
}

function setDrawMode(on) {
  drawMode = on;
  if (!map) return;
  if (on) {
    map.dragging.disable();
    map.getContainer().style.cursor = 'crosshair';
    $('drawStart').textContent = '绘制中…';
  } else {
    map.dragging.enable();
    map.getContainer().style.cursor = '';
    $('drawStart').textContent = '继续绘制';
  }
}
function clearDrawing() {
  strokes = [];
  currentStroke = null;
  isPointerDown = false;
  redrawStrokes();
}
function useDrawing() {
  const usable = strokes.filter(s => s.length >= 2);
  if (!usable.length) { alert('先画一条线'); return null; }
  // 多笔按顺序首尾拼成一条，供后端重采样
  const merged = [];
  for (const st of usable) {
    if (merged.length && metersBetween(merged[merged.length - 1], st[0]) < 30) {
      merged.push(...st.slice(1));
    } else {
      merged.push(...st);
    }
  }
  return merged;
}

/* ---------- 禁区标注 ----------
 * OSM 在国内校园基本是空白（实测这个校区整个 bbox 只有 15 个 way、76 个
 * node，一栋楼都没有），Overpass 拉不到建筑轮廓，轨迹就只能按几何直线走，
 * 从教学楼、宿舍楼中间穿过去。
 *
 * 这里让人在地图上圈一次：拖出矩形盖住楼，存到本地 blockers.json，
 * 之后所有规划都会绕开（fence_route::avoid_blockers）。
 */
let blockMode = false, blockStart = null, blockTemp = null, localBlockers = [];
let blockLayer = null;

function blockerRectFromBounds(b) {
  return [
    [b.getSouth(), b.getWest()],
    [b.getSouth(), b.getEast()],
    [b.getNorth(), b.getEast()],
    [b.getNorth(), b.getWest()],
  ];
}

function drawBlockers() {
  if (!blockLayer) return;
  blockLayer.clearLayers();
  localBlockers.forEach(poly => {
    L.polygon(poly, { color: '#f85149', weight: 2, dashArray: '5 3', fillOpacity: .18 })
      .addTo(blockLayer);
  });
  const n = localBlockers.length;
  $('blockInfo').textContent = blockMode
    ? (n ? `拖拽继续圈，共 ${n} 块；画完点「保存禁区」` : '在地图上按住拖出一个矩形，把楼盖住')
    : (n ? `已标注 ${n} 块禁区（轨迹会绕开）` : '还没标注禁区');
}

function setBlockMode(v) {
  blockMode = v;
  $('blockStart').textContent = v ? '停止标注' : '标注禁区（画楼）';
  if (map) map.getContainer().style.cursor = v ? 'crosshair' : '';
  if (!v && blockTemp) { blockTemp.remove(); blockTemp = null; }
  blockStart = null;
  drawBlockers();
}

async function loadBlockers() {
  try {
    const r = await api('/api/blockers');
    localBlockers = (r.polys || []).map(p => p.map(q => [q[0], q[1]]));
    drawBlockers();
  } catch (e) {
    $('blockInfo').textContent = '读取已存禁区失败：' + e.message;
  }
}

function initBlockers() {
  if (!map || map.__blockBound) return;
  map.__blockBound = true;
  blockLayer = L.layerGroup().addTo(map);
  $('blockStart').onclick = () => setBlockMode(!blockMode);
  $('blockUndo').onclick = () => {
    if (!localBlockers.length) return;
    localBlockers.pop();
    drawBlockers();
  };
  $('blockSave').onclick = async () => {
    try {
      const r = await api('/api/blockers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ polys: localBlockers }),
      });
      $('blockInfo').textContent = `已保存 ${r.saved} 块禁区，之后的轨迹会绕开`;
      setBlockMode(false);
    } catch (e) {
      $('blockInfo').textContent = '保存失败：' + e.message;
    }
  };
  loadBlockers();
}

function initDrawing() {
  if (!map || map.__drawBound) return;
  map.__drawBound = true;
  const el = map.getContainer();

  const toLatLng = ev => {
    const r = el.getBoundingClientRect();
    return map.containerPointToLatLng(L.point(ev.clientX - r.left, ev.clientY - r.top));
  };

  el.addEventListener('pointerdown', ev => {
    if (blockMode) {
      ev.preventDefault();
      blockStart = toLatLng(ev);
      blockTemp = L.rectangle(L.latLngBounds(blockStart, blockStart), {
        color: '#f85149', weight: 2, fillOpacity: .2,
      }).addTo(map);
      return;
    }
    if (!drawMode) return;
    ev.preventDefault();
    isPointerDown = true;
    el.setPointerCapture(ev.pointerId);
    const ll = toLatLng(ev);
    currentStroke = [[ll.lat, ll.lng]];
    strokes.push(currentStroke);
    redrawStrokes();
  });

  el.addEventListener('pointermove', ev => {
    if (blockMode && blockStart && blockTemp) {
      blockTemp.setBounds(L.latLngBounds(blockStart, toLatLng(ev)));
      return;
    }
    if (!drawMode || !isPointerDown || !currentStroke) return;
    ev.preventDefault();
    const ll = toLatLng(ev);
    const last = currentStroke[currentStroke.length - 1];
    // 太密的点丢掉，不然一条线几千个点，报文会爆
    if (metersBetween(last, [ll.lat, ll.lng]) < 3) return;
    currentStroke.push([ll.lat, ll.lng]);
    redrawStrokes();
  });

  const finish = ev => {
    if (blockMode && blockStart && blockTemp) {
      const b = blockTemp.getBounds();
      blockTemp.remove();
      blockTemp = null;
      blockStart = null;
      // 太小的当成误点，不记
      const dN = metersBetween([b.getSouth(), b.getWest()], [b.getNorth(), b.getEast()]);
      if (dN >= 8) {
        localBlockers.push(blockerRectFromBounds(b));
        drawBlockers();
      }
      return;
    }
    if (!isPointerDown) return;
    isPointerDown = false;
    currentStroke = null;
    try { el.releasePointerCapture(ev.pointerId); } catch (e) {}
    redrawStrokes();
  };
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', finish);
  el.addEventListener('pointerleave', finish);

  $('drawStart').onclick = () => setDrawMode(!drawMode);
  $('drawUndo').onclick = () => { strokes.pop(); redrawStrokes(); };
  $('drawClear').onclick = clearDrawing;
  $('drawUse').onclick = () => {
    const merged = useDrawing();
    if (!merged) return;
    setDrawMode(false);
    $('drawInfo').textContent =
      `已采用 ${(strokesLength() / 1000).toFixed(2)} km，点“生成轨迹”或直接提交`;
  };
}

/* ---------- 记录列表 ---------- */
async function loadRecords() {
  $('list').innerHTML = '<div class="empty"><span class="spin"></span> 加载中…</div>';
  try {
    const data = await api('/api/records?page=1&size=20&type=1');
    const rows = pickRows(data);
    if (!rows.length) {
      $('list').innerHTML = '<div class="empty">这个学期还没有跑步记录</div>';
      return;
    }
    $('list').innerHTML = rows.map((r, i) => recHtml(r, i)).join('');
    [...document.querySelectorAll('.rec')].forEach((el, i) => {
      el.onclick = () => selectRec(rows[i], el);
    });
    selectRec(rows[0], document.querySelector('.rec'));
  } catch (e) {
    $('list').innerHTML = '<div class="empty" style="color:var(--bad)">' + esc(e.message) + '</div>';
  }
}

/* 里程读数：统一成公里。
 * 服务端给米（totalDis=2000），个别接口给公里（2.5），单看数字分不清，
 * 用 200 做阈值：跑步记录不可能小于 0.2 km，小于它的一定是公里口径。
 * 后端已经补了 distanceKm，这里是第二道保险（后端没更新时前端也能显示对）。 */
function km(obj, ...keys) {
  if (obj && obj.distanceKm != null && keys[0] === 'totalDistance') return num(obj.distanceKm);
  for (const k of keys) {
    const v = num(obj?.[k]);
    if (v > 0) return v < 200 ? v : v / 1000;
  }
  return 0;
}

/* 列表响应结构在不同版本里可能是 {records:[...]} / {list:[...]} / 直接数组 */
function pickRows(d) {
  if (Array.isArray(d)) return d;
  for (const k of ['records', 'list', 'rows', 'data', 'items']) {
    if (Array.isArray(d?.[k])) return d[k];
  }
  return [];
}

function recHtml(r, i) {
  // 服务端字段是 totalDis（米），后端已归一化出 totalDistance/distanceKm；
  // 这里再兜一层并做量级判断，免得哪天出口改名又变回 0.00 km。
  const dist = km(r, 'totalDistance', 'totalDis', 'total_distance', 'distance');
  const secs = int(r.totalTime ?? r.total_time ?? r.runTime);
  // 服务端判定字段是 complete（bool）。以前读 isValid / status===1，
  // 而服务端根本不给这两个 —— undefined 恒为假，于是每条都显示「未达标」，
  // 哪怕 complete=true、statusInfo 写着「太棒了，恭喜您完成了跑步」。
  const valid = r.complete ?? r.completed ?? r.isValid ?? r.is_valid ?? false;
  const start = r.startTime ?? r.start_time;
  return `<div class="rec" data-i="${i}">
    <div class="r1">
      <span class="dist">${dist.toFixed(2)} km</span>
      <span class="tag ${valid ? 'ok' : 'bad'}">${valid ? '有效' : '未达标'}</span>
    </div>
    <div class="r2">
      <span>${fmtDate(start)}</span>
      <span>${fmtDur(secs)}</span>
      <span>${pace(dist, secs)}</span>
    </div>
  </div>`;
}

/* ---------- 从 OBS 拉轨迹 ----------
 * 服务端详情接口对工具提交的记录不返回坐标（jsonFromObs=1 → App 查本地库），
 * 但轨迹对象确实在对象存储里，key 规则是 run_data/{rrid/1000000}/{rrid}.json。
 * 用后端 /api/obs/fetch 换 Get 签名下载，浏览器侧用 DecompressionStream('gzip')
 * 解压，再取 run_data.allLocJson。
 */
async function ungzipB64(b64) {
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const out = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(out).text();
}

/// 候选 objectKey。真机记录只有 run_data/{本地小时}/{uuid}.json 一种；工具提交的
/// 三种都传了。原来只试 rrid 那种，于是真机跑的记录明明有轨迹也显示"没有"。
function obsKeys(rrid, uuid, startMs) {
  const keys = [];
  if (uuid && startMs) {
    const hour = off => {
      const d = new Date(startMs + off);
      const p = n => String(n).padStart(2, '0');
      return d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) + p(d.getUTCHours());
    };
    for (const u of new Set([uuid, uuid.toLowerCase(), uuid.toUpperCase()])) {
      keys.push(`run_data/${hour(8 * 3600e3)}/${u}.json`); // 本地时区 UTC+8
    }
    keys.push(`run_data/${hour(0)}/${uuid}.json`);          // UTC 兜底
  }
  if (rrid) keys.push('run_data/' + Math.floor(rrid / 1000000) + '/' + rrid + '.json');
  return keys;
}

async function obsTrack(rrid, uuid, startMs) {
  for (const key of obsKeys(rrid, uuid, startMs)) {
    try {
      const j = await api('/api/obs/fetch', { method: 'POST', body: JSON.stringify({ key }) });
      const obj = j.data ?? j;
      if (!obj || !obj.run_data) continue;
      const wrap = JSON.parse(await ungzipB64(obj.run_data));
      const raw = wrap.allLocJson;
      const arr = typeof raw === 'string' ? JSON.parse(raw) : raw;
      if (!Array.isArray(arr)) continue;
      // gLat/gLng 是 GCJ-02，lat/lng 是 BD-09；底图按 GCJ-02 走更贴合
      const pts = arr
        .map(p => ({ lat: num(p.gLat) || num(p.lat), lng: num(p.gLng) || num(p.lng) }))
        .filter(p => p.lat > 0 && p.lng > 0);
      if (pts.length > 1) return pts;
    } catch (e) { /* 这个 key 没有，试下一个 */ }
  }
  return null;
}

/// 校区中心（GCJ-02）。没轨迹可画时地图居中到这里，而不是写死的成都。
let homeCenter = null;
async function goHome() {
  if (!map) return;
  if (!homeCenter) {
    try { homeCenter = await api('/api/home'); } catch (_) { return; }
  }
  if (homeCenter && homeCenter.lat) map.setView([homeCenter.lat, homeCenter.lng], 17);
}

/* ---------- 单条详情 ---------- */
async function selectRec(r, el) {
  document.querySelectorAll('.rec').forEach(x => x.classList.remove('sel'));
  if (el) el.classList.add('sel');
  const rrid = r.rrid ?? r.id ?? r.recordId;
  layer.clearLayers();
  $('detail').innerHTML = '<span class="spin"></span> 加载轨迹…';
  if (!rrid) { $('detail').textContent = '这条记录没有 rrid'; return; }

  try {
    const d = await api('/api/record/' + rrid);
    let pts = findTrack(d);
    // 服务端详情不带轨迹点（jsonFromObs=1 时 App 也去查手机本地库），
    // 但轨迹对象一直在 OBS 里：key 是 run_data/{rrid/1000000}/{rrid}.json。
    // 拉下来 → gzip 解压 → 取 run_data.allLocJson → 就能画线。
    if (pts.length <= 1) {
      $('detail').innerHTML = '<span class="spin"></span> 从 OBS 拉轨迹…';
      const obs = await obsTrack(rrid, r.uuid ?? d.uuid, num(r.startTime ?? d.startTime));
      if (obs && obs.length > 1) pts = obs;
    }
    if (pts.length > 1) {
      const line = L.polyline(pts, { color: '#4493f8', weight: 4, opacity: .9 }).addTo(layer);
      L.circleMarker(pts[0], { radius: 6, color: '#3fb950', fillOpacity: 1 }).addTo(layer);
      L.circleMarker(pts[pts.length - 1], { radius: 6, color: '#f85149', fillOpacity: 1 }).addTo(layer);
      map.fitBounds(line.getBounds(), { padding: [24, 24] });
      map.invalidateSize();
      $('detail').innerHTML = detailHtml(d, pts.length);
    } else {
      await goHome();
      $('detail').innerHTML = detailHtml(d, 0) +
        '<div style="margin-top:8px;color:var(--dim)">OBS 里没找到这条记录的轨迹对象' +
        '（几种 objectKey 都试过了），多半是当时上传失败。</div>';
    }
  } catch (e) {
    $('detail').innerHTML = '<span style="color:var(--bad)">' + esc(e.message) + '</span>';
  }
}

function detailHtml(d, n) {
  const g = (k, alt) => d[k] ?? alt;
  const dist = km(d, 'totalDistance', 'totalDis', 'total_distance');
  const vdist = km(d, 'validDistance', 'validDis', 'valid_distance');
  const secs = int(g('totalTime', g('total_time')));
  const vsecs = int(g('validTime', g('valid_time')));
  const cal = int(g('calorie'));
  const freq = int(g('avgStepFreq', g('avg_step_freq', g('stepFreq'))));
  const reason = g('unCompleteReason', g('uncomplete_reason'));
  // reasonList 是逐条规则的判定：complete=false 的那几条就是没达标的原因
  const reasons = Array.isArray(d.reasonList)
    ? d.reasonList.filter(x => x && x.complete === false && x.reason).map(x => x.reason)
    : [];
  const rows = [
    ['总距离', dist.toFixed(2) + ' km'],
    ['有效距离', vdist.toFixed(2) + ' km'],
    ['总时长', fmtDur(secs)],
    ['有效时长', fmtDur(vsecs)],
    ['配速', pace(dist, secs)],
    ['步频', freq ? freq + ' 步/分' : '—'],
    ['消耗', cal ? cal + ' 千卡' : '—'],
    ['轨迹点', n ? n + ' 个' : '无'],
  ];
  if (reasons.length) rows.push(['未通过规则', reasons.join('、')]);
  else if (reason) rows.push(['未达标原因', String(reason)]);
  // jsonFromObs=1 表示这条记录的轨迹在 App 本地库里，服务端不存点——详情页
  // 拉不到坐标是正常的，不是上传失败（见 TRAJECTORY-DISPLAY.md）。
  if (d.jsonFromObs === 1 && n === 0) {
    rows.push(['轨迹来源', 'App 本地库（服务端不存轨迹点）']);
  }
  return '<div class="kv">' + rows.map(([k, v]) => `<span>${k}</span><span>${esc(String(v))}</span>`).join('') + '</div>';
}

/* ---------- 轨迹自动探测 ----------
 * 服务端字段名不稳定，递归扫描 JSON：
 *   1. 形如 "lng,lat,lng,lat,..." 的字符串
 *   2. 形如 [[lng,lat], ...] 的数组
 *   3. 形如 [{lat,lng|lon|latitude,longitude}, ...] 的对象数组
 * 取点数最多的那一个。
 */
function findTrack(obj) {
  let best = [];
  const visit = (v, depth) => {
    if (depth > 6 || v == null) return;
    if (typeof v === 'string') {
      const pts = parseCoordString(v);
      if (pts.length > best.length) best = pts;
      return;
    }
    if (Array.isArray(v)) {
      const pts = parseCoordArray(v);
      if (pts.length > best.length) best = pts;
      v.forEach(x => visit(x, depth + 1));
      return;
    }
    if (typeof v === 'object') {
      Object.values(v).forEach(x => visit(x, depth + 1));
    }
  };
  visit(obj, 0);
  return best;
}

function valid(lat, lng) {
  return Number.isFinite(lat) && Number.isFinite(lng) &&
         Math.abs(lat) <= 90 && Math.abs(lng) <= 180 &&
         !(lat === 0 && lng === 0);
}

function parseCoordString(s) {
  if (s.length < 20 || !/[\d.]/.test(s)) return [];
  // 常见：lng,lat,lng,lat,... 或 lng,lat;lng,lat
  const nums = s.split(/[;,\s]+/).map(Number).filter(n => Number.isFinite(n));
  if (nums.length < 4) return [];
  const out = [];
  for (let i = 0; i + 1 < nums.length; i += 2) {
    const a = nums[i], b = nums[i + 1];
    // 判断哪个是纬度：国内 lat 在 18~54，lng 在 73~136
    if (valid(b, a) && Math.abs(b) < 60) out.push([b, a]);
    else if (valid(a, b) && Math.abs(a) < 60) out.push([a, b]);
  }
  return out;
}

function parseCoordArray(arr) {
  if (!arr.length) return [];
  const first = arr[0];
  if (Array.isArray(first) && first.length >= 2) {
    const out = [];
    for (const p of arr) {
      const a = Number(p[0]), b = Number(p[1]);
      if (valid(b, a) && Math.abs(b) < 60) out.push([b, a]);
      else if (valid(a, b) && Math.abs(a) < 60) out.push([a, b]);
    }
    return out;
  }
  if (first && typeof first === 'object') {
    const out = [];
    for (const p of arr) {
      const lat = num(p.lat ?? p.latitude);
      const lng = num(p.lng ?? p.lon ?? p.longitude);
      if (valid(lat, lng)) out.push([lat, lng]);
    }
    return out;
  }
  return [];
}

/* ---------- 格式化 ---------- */
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const int = v => Math.round(num(v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmtDate(ms) {
  const n = num(ms);
  if (!n) return '—';
  const d = new Date(n < 1e12 ? n * 1000 : n);
  const p = x => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDur(sec) {
  const s = int(sec);
  if (!s) return '—';
  const m = Math.floor(s / 60);
  return `${m}′${String(s % 60).padStart(2, '0')}″`;
}
function pace(km, sec) {
  if (!km || !sec) return '—';
  const p = sec / km;
  const m = Math.floor(p / 60), s = Math.round(p % 60);
  return `${m}′${String(s).padStart(2, '0')}″/km`;
}

/* ---------- 启动 ---------- */
async function boot() {
  try {
    const me = await api('/api/me');
    enter(me);
    await loadAccounts();
  } catch (_) {
    // 未登录：如果库里有存过密码的账号，直接给个选择界面
    try {
      const r = await api('/api/accounts');
      const usable = (r.accounts || []).filter(a => a.hasPassword);
      if (usable.length) {
        showPicker(usable, r);
        return;
      }
    } catch (_) {}
    // 什么都没有，停在登录页
  }
}

function showPicker(list, r) {
  $('login').style.display = 'none';
  const box = $('picker');
  box.style.display = 'flex';
  box.innerHTML = `
    <div style="margin:auto;max-width:420px;width:100%;padding:32px 22px;background:#0d1117;border:1px solid #21262d;border-radius:14px">
      <h1 style="margin:0 0 4px;font-size:22px">选择账号</h1>
      <p class="hint" style="margin:0 0 18px">库里存了 ${list.length} 个账号，点一下直接登录</p>
      ${list.map(a => `
        <button class="ghost" data-id="${a.id}"
          style="width:100%;text-align:left;margin-bottom:8px;padding:12px 14px">
          <b>${a.label}</b>
          <div class="hint" style="font-size:11px">${a.username} · ${a.school || '—'}</div>
        </button>`).join('')}
      <button class="ghost" id="pickOther" style="width:100%;margin-top:6px">用其他账号登录</button>
      <div class="msg" id="pickMsg"></div>
    </div>`;

  box.querySelectorAll('button[data-id]').forEach(b => {
    b.onclick = async () => {
      const m = $('pickMsg');
      m.textContent = '登录中…';
      m.className = 'msg';
      try {
        const res = await api('/api/accounts/' + encodeURIComponent(b.dataset.id) + '/login', { method: 'POST' });
        box.style.display = 'none';
        $('picker').innerHTML = '';
        enter({ name: res.name, uid: res.uid });
        await loadAccounts();
      } catch (e) {
        m.textContent = e.message;
        m.className = 'msg err';
      }
    };
  });
  $('pickOther').onclick = () => {
    box.style.display = 'none';
    box.innerHTML = '';
    $('login').style.display = 'flex';
  };
}

boot();
</script>
